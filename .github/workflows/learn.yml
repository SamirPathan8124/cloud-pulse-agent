name: learn-from-pr
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  learn:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'agent/fix-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-genai qdrant-client PyGithub python-dotenv
      - name: save lesson to memory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python agent/learn.py
